<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Okay FreeCell – Juiced</title>
<style>
/* This file is intended as a visual patch layer for the user's existing game.
   Paste over your current file if needed. */

:root{
  --bg-base:#1a3828;
  --bg-deep:#0c1711;
  --accent:#f0c040;
}

body{
  margin:0;
  background:#0c1711;
  overflow:hidden;
  font-family:Inter,system-ui,sans-serif;
}

#app{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,255,255,0.06), transparent 38%),
    radial-gradient(circle at 50% 18%, #2d5b42 0%, #183122 48%, #0c1711 100%);
}

#app::before{
  content:'';
  position:fixed;
  inset:-20%;
  pointer-events:none;
  opacity:0.05;
  background:
    radial-gradient(circle at 20% 20%, white, transparent 20%),
    radial-gradient(circle at 80% 60%, white, transparent 18%);
  animation:ambientDrift 18s ease-in-out infinite alternate;
}

@keyframes ambientDrift{
  from{transform:translate3d(-1%,-1%,0) rotate(0deg);}
  to{transform:translate3d(1%,1%,0) rotate(1deg);}
}

.card{
  position:relative;
  border-radius:14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.82)),
    linear-gradient(160deg, #fffef8 0%, #f3f0e7 100%);
  box-shadow:
    0 10px 28px rgba(0,0,0,0.34),
    0 3px 8px rgba(0,0,0,0.2);
  transition:
    transform .14s cubic-bezier(.22,1.25,.36,1),
    box-shadow .16s ease;
}

.card::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.45), transparent 30%),
    radial-gradient(circle at top left, rgba(255,255,255,0.4), transparent 35%);
  pointer-events:none;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:
    0 18px 40px rgba(0,0,0,0.42),
    0 5px 12px rgba(0,0,0,0.22);
}

.slot{
  position:relative;
  border-radius:14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.08));
  border:1px solid rgba(255,255,255,0.08);
}

.slot::after{
  content:'';
  position:absolute;
  inset:10%;
  border-radius:10px;
  border:1px dashed rgba(255,255,255,0.06);
}

.stat-val{
  font-family:system-ui,sans-serif;
  font-weight:800;
  letter-spacing:-0.03em;
}

.found-pop{
  animation:
    foundPop .26s cubic-bezier(.34,1.56,.64,1),
    foundGlow .6s ease;
}

@keyframes foundPop{
  0%{transform:scale(1);}
  50%{transform:scale(1.12);}
  100%{transform:scale(1);}
}

@keyframes foundGlow{
  0%{box-shadow:0 0 0 rgba(240,192,64,0);}
  50%{box-shadow:0 0 24px rgba(240,192,64,0.45);}
  100%{box-shadow:0 0 0 rgba(240,192,64,0);}
}

.demo{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:28px;
  opacity:.8;
}
</style>
</head>
<body>
<div id="app">
  <div class="demo">
    Visual polish patch applied.<br>
    Merge these styles + animation tweaks into your full game file.
  </div>
</div>
</body>
</html>
